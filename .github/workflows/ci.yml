name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: TypeScript build
        run: npm run build
      - name: ESLint
        run: npm run lint
      - name: Test suite including security and all streets
        run: npm test
      - name: CLI smoke test
        run: node dist/bin/poker-odds-calculator.js --iterations 100 AsAh KsKh
      - name: CLI must fail on invalid user input
        run: |
          if node dist/bin/poker-odds-calculator.js --iterations Infinity AsAh KsKh; then
            echo "CLI unexpectedly accepted invalid iterations" >&2
            exit 1
          fi

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
